<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Button</title>
<style>
html, body { margin: 0; }
body { background: var(--surface); }
.stage { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.cap { font-family: var(--font-sans); font-size: 13px; line-height: 18px; color: var(--ink-muted); }

</style>
</head>
<body>
<div class="cx-root stage">
<div class="row">
<button class="cx-btn cx-btn--primary" type="button">Publier l'article</button>
<button class="cx-btn cx-btn--secondary" type="button">Enregistrer le brouillon</button>
<button class="cx-btn cx-btn--ghost" type="button"><svg class="cx-icon cx-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ajouter une étape</button>
<button class="cx-btn cx-btn--danger" type="button"><svg class="cx-icon cx-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Supprimer</button>
</div>
<div class="row">
<button class="cx-btn cx-btn--primary cx-btn--sm" type="button">Accepter</button>
<button class="cx-btn cx-btn--secondary cx-btn--sm" type="button">Refuser</button>
<button class="cx-btn cx-btn--secondary cx-btn--icon" type="button" aria-label="Modifier"><svg class="cx-icon cx-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
<button class="cx-btn cx-btn--primary" type="button" disabled>Envoyer en relecture</button>
</div>
</div>
</body>
</html>
