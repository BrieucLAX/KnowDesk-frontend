<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Card</title>
<style>
html, body { margin: 0; }
body { background: var(--surface); }
.stage { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.cap { font-family: var(--font-sans); font-size: 13px; line-height: 18px; color: var(--ink-muted); }

</style>
</head>
<body>
<div class="cx-root stage">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
<a class="cx-card" href="#">
<span class="cx-badge cx-badge--primary" style="align-self: flex-start;">Procédure</span>
<h3 class="cx-card__title">Comment retourner un article ?</h3>
<p class="cx-card__meta">Retours et remboursements · mis à jour le 28 oct.</p>
</a>
<div class="cx-card cx-card--warm">
<span class="cx-kd"><svg class="cx-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4M22 5h-4M4 17v2M5 18H3"/></svg>Préparé par KnowDesk</span>
<p style="margin: 0;">L'adresse peut être modifiée tant que la commande n'est pas expédiée.</p>
</div>
<div class="cx-card cx-card--internal">
<h3 class="cx-card__title" style="display: flex; align-items: center; gap: 8px;"><svg class="cx-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Interne · réservé aux agents</h3>
<p style="margin: 0;">Commande expédiée : demander un réacheminement au transporteur.</p>
</div>
</div>
</div>
</body>
</html>
