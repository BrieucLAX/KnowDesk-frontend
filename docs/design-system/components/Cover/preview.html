<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Design system CX</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  /* top-band skeleton: the name is too wide for the 440px zone, so blocks run full width across the top */
  .band { position:absolute; top:0; left:0; width:960px; height:120px; overflow:hidden; }
  .band svg { display:block; width:960px; height:120px; }
  .brand { fill:var(--primary); }
  .tint { fill:var(--primary-soft); }
  .warm { fill:var(--accent); }
  .deep { fill:var(--ink); }
  .cut { fill:var(--primary-soft); }
  .blk { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-6); right:var(--space-6); bottom:var(--space-6); }
  .name { margin:0; font-size:64px; line-height:.95; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 120" width="960" height="120">
<!--
  blocks      primary 432×136 (the pétrole, largest, bled off the top) · primary-soft 184×112 (the tint) · accent 112×136 (the framboise warmth, narrow) · ink 184×96 bleeding off the right edge
  arrangement a strip of unequal bands hanging from the top edge, bottoms staggered, space-4 gutters, inset space-6
  pattern     discs, from "des coins généreusement arrondis" and radius-lg: 16px discs at a space-6 pitch, two rows over the tint, three primary-soft discs cut into the pétrole slab
  scales      sides in space-2 multiples; gutters space-4; pitch space-6; corners radius-lg; discs r = space-2
-->
<rect class="brand blk" x="24" y="-20" width="432" height="136" rx="20"/>
<rect class="tint blk" x="472" y="-20" width="184" height="112" rx="20"/>
<rect class="warm blk" x="672" y="-20" width="112" height="136" rx="20"/>
<rect class="deep blk" x="800" y="-20" width="184" height="96" rx="20"/>
<circle class="brand" cx="500" cy="44" r="8"/>
<circle class="brand" cx="524" cy="44" r="8"/>
<circle class="brand" cx="548" cy="44" r="8"/>
<circle class="brand" cx="572" cy="44" r="8"/>
<circle class="brand" cx="596" cy="44" r="8"/>
<circle class="brand" cx="620" cy="44" r="8"/>
<circle class="brand" cx="524" cy="68" r="8"/>
<circle class="brand" cx="572" cy="68" r="8"/>
<circle class="brand" cx="620" cy="68" r="8"/>
<circle class="cut" cx="384" cy="92" r="8"/>
<circle class="cut" cx="408" cy="92" r="8"/>
<circle class="cut" cx="432" cy="92" r="8"/>
</svg>
</div>
<div class="words">
<h1 class="name">Design system CX</h1>
<p class="tag">Moderne et chaleureux, au service de la relation client.</p>
</div>
</div>
</body>
</html>
